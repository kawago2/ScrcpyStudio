name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. Build macOS Installer (.dmg)
  # ============================================================================
  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pywebview pyobjc-framework-WebKit pyinstaller

      - name: Build macOS .app & .dmg
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh "${{ github.ref_name }}"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: ScrcpyStudio_macOS_*.dmg

  # ============================================================================
  # 2. Build Windows Installer (.exe)
  # ============================================================================
  build-windows:
    name: Build Windows (.exe Setup)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywebview pyinstaller

      - name: Build Executable with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name "ScrcpyStudio" `
            --icon "app_icon.ico" `
            --add-data "ui;ui" `
            scrcpy_studio.py

      - name: Compile Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer.iss
          options: /DMyAppVersion=${{ github.ref_name }}

      - name: Rename & Package Windows Setup
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $dest = "ScrcpyStudio_Windows_v$ver.exe"
          Copy-Item "installer_output\ScrcpyStudio_Windows_Setup.exe" $dest
          Write-Host "Created: $dest"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: ScrcpyStudio_Windows_*.exe

  # ============================================================================
  # 3. Create GitHub Release & Upload Assets
  # ============================================================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: release_assets

      - name: Download Windows Setup
        uses: actions/download-artifact@v4
        with:
          name: windows-setup
          path: release_assets

      - name: Create Release and Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
